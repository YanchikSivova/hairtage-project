name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hairtage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hairtage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hairtage
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: bash Hairitage/mvnw -B -f Hairitage/pom.xml test

  frontend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory: [frontend, frontend-admin]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.directory }}
        run: npm run lint
      - name: Build
        working-directory: ${{ matrix.directory }}
        run: npm run build